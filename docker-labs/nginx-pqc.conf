# PQC TLS for nginx — four listeners, four postures.
#
# All cryptography comes from the OpenSSL 3.5.x statically linked into this
# nginx at build time (--with-openssl). Group names are OpenSSL 3.5 NATIVE
# names; oqs-provider spellings (x25519_mlkem768) are not recognized.
#
# Unlike Apache mod_ssl, nginx exposes the negotiated TLS group as a log
# variable ($ssl_curve) — per-connection post-quantum evidence from the
# server's own records.

worker_processes 1;
error_log /opt/nginx/logs/error.log info;

events { worker_connections 256; }

http {
    log_format pqc '$remote_addr [$time_local] "$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher group=$ssl_curve '
                   'upstream=$upstream_addr';
    access_log /opt/nginx/logs/pqc_access.log pqc;

    # ------------------------------------------------------------ 8443
    # CNSA 2.0 algorithms, interoperable: ML-KEM-1024 preferred, hybrids
    # accepted. ML-DSA-87 chain.
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_protocols TLSv1.3;
        ssl_certificate     /opt/pki/server.crt;
        ssl_certificate_key /opt/pki/server.key;
        ssl_conf_command Groups MLKEM1024:SecP384r1MLKEM1024:X25519MLKEM768;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
        return 200 "PQC nginx: CNSA-interoperable listener\n";
    }

    # ------------------------------------------------------------ 8444
    # Browser-compatible: classical ECDSA chain + ML-KEM hybrid key
    # exchange. Post-quantum confidentiality with a real padlock.
    server {
        listen 8444 ssl;
        server_name localhost;
        ssl_protocols TLSv1.3;
        ssl_certificate     /opt/pki-ec/server.crt;
        ssl_certificate_key /opt/pki-ec/server.key;
        ssl_conf_command Groups X25519MLKEM768:X25519:secp256r1;
        return 200 "PQC nginx: browser listener\n";
    }

    # ------------------------------------------------------------ 8445
    # CNSA 2.0 STRICT: ML-KEM-1024 or nothing, AES-256 or nothing.
    # A classical-only client is refused (alert 40) — exclusion, not
    # preference, which is what the IETF profile requires.
    server {
        listen 8445 ssl;
        server_name localhost;
        ssl_protocols TLSv1.3;
        ssl_certificate     /opt/pki/server.crt;
        ssl_certificate_key /opt/pki/server.key;
        ssl_conf_command Groups MLKEM1024;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
        return 200 "PQC nginx: CNSA-strict listener\n";
    }

    # ------------------------------------------------------------ 8447
    # PQC-terminating LOAD BALANCER — the edge architecture. Two plain-HTTP
    # backends stand in for classical application servers (JVMs, legacy
    # stacks — anything that cannot do PQC itself). Post-quantum TLS
    # terminates here; the pool speaks classical HTTP inside. This is the
    # deployment pattern the Tomcat chapter calls Route 3, demonstrated.
    server { listen 127.0.0.1:9001; access_log off; return 200 "backend-ONE\n"; }
    server { listen 127.0.0.1:9002; access_log off; return 200 "backend-TWO\n"; }
    upstream classical_pool {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        # round-robin is the default; least_conn and ip_hash are compiled in
    }
    server {
        listen 8447 ssl;
        server_name localhost;
        ssl_protocols TLSv1.3;
        ssl_certificate     /opt/pki/server.crt;
        ssl_certificate_key /opt/pki/server.key;
        ssl_conf_command Groups X25519MLKEM768:MLKEM1024;
        location / { proxy_pass http://classical_pool; }
        # Each request logs as: group=<ML-KEM group> -> upstream <backend> —
        # the whole edge architecture in one line.
    }

    # ------------------------------------------------------------ 8446
    # Dual certificates — the migration bridge: ML-DSA and ECDSA side by
    # side in one server block, selected per client by its advertised
    # signature algorithms. PQC clients get post-quantum authentication,
    # classical clients (all current browsers) get ECDSA, both get ML-KEM.
    server {
        listen 8446 ssl;
        server_name localhost;
        ssl_protocols TLSv1.3;
        ssl_certificate     /opt/pki/server.crt;      # ML-DSA-87
        ssl_certificate_key /opt/pki/server.key;
        ssl_certificate     /opt/pki-ec/server.crt;   # ECDSA P-256
        ssl_certificate_key /opt/pki-ec/server.key;
        ssl_conf_command Groups X25519MLKEM768:X25519:secp256r1;
        return 200 "PQC nginx: dual-certificate listener\n";
    }
}
