# PQC TLS for Apache httpd — three listeners, three postures.
#
# Everything cryptographic here is delegated to the OpenSSL 3.5.x this image
# builds from source; mod_ssl contributes configuration, not algorithms. The
# group names below are OpenSSL 3.5 NATIVE names (X25519MLKEM768, MLKEM1024,
# SecP384r1MLKEM1024). Guidance written for oqs-provider setups uses different
# spellings (x25519_mlkem768, p256_mlkem768) which OpenSSL 3.5 does not
# recognize — a config written from those sources fails at startup.

ServerName localhost
Listen 8443
Listen 8444
Listen 8445

SSLSessionCache "shmcb:/opt/httpd/logs/ssl_scache(512000)"

# ---------------------------------------------------------------- 8443
# CNSA 2.0 algorithms with an interoperable group list: pure ML-KEM-1024
# preferred, hybrids accepted for clients that require them. ML-DSA-87 chain.
<VirtualHost *:8443>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /opt/pki/server.crt
    SSLCertificateKeyFile /opt/pki/server.key
    SSLOpenSSLConfCmd Groups MLKEM1024:SecP384r1MLKEM1024:X25519MLKEM768
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384
    # mod_ssl exposes SSL_PROTOCOL and SSL_CIPHER to the log format, but has
    # no variable for the negotiated TLS group — the one parameter a
    # post-quantum audit most wants. Documented gap; see the Apache chapter.
    CustomLog logs/pqc_ssl_log "%t %h {%{SSL_PROTOCOL}x} {%{SSL_CIPHER}x} \"%r\" %b"
</VirtualHost>

# ---------------------------------------------------------------- 8444
# Browser-compatible: classical ECDSA chain + ML-KEM hybrid key exchange.
# Post-quantum confidentiality with a real padlock — the deployable first step.
<VirtualHost *:8444>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /opt/pki-ec/server.crt
    SSLCertificateKeyFile /opt/pki-ec/server.key
    SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:secp256r1
    CustomLog logs/browser_ssl_log "%t %h {%{SSL_PROTOCOL}x} {%{SSL_CIPHER}x} \"%r\" %b"
</VirtualHost>

# ---------------------------------------------------------------- 8445
# CNSA 2.0 STRICT: exclusion, not preference. The group list contains only
# ML-KEM-1024 and the ciphersuite list only TLS_AES_256_GCM_SHA384, so a
# client offering anything else is refused outright (alert 40) rather than
# negotiated down. This is the behavior the IETF CNSA 2.0 TLS profile
# requires — and the posture Tomcat's server.xml cannot express.
<VirtualHost *:8445>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /opt/pki/server.crt
    SSLCertificateKeyFile /opt/pki/server.key
    SSLOpenSSLConfCmd Groups MLKEM1024
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384
    CustomLog logs/cnsa_strict_log "%t %h {%{SSL_PROTOCOL}x} {%{SSL_CIPHER}x} \"%r\" %b"
</VirtualHost>
